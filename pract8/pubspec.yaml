name: media_gallery_app
description: Галерея с видео и музыкальным плеером
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  permission_handler: ^11.0.1
  photo_manager: ^3.0.0
  video_player: ^2.8.0
  chewie: ^1.8.0
  audioplayers: ^5.2.0
  cached_network_image: ^3.3.0
  url_launcher: ^6.2.0
  path_provider: ^2.1.1
  http: ^1.1.0
  hive_flutter: ^1.1.0 

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  hive_generator: ^2.0.0
  build_runner: ^2.4.0

flutter:
  uses-material-design: true